<style>
:root {
  color-scheme: light;
  --bg: #EEEBE2; --panel: #F7F5EF; --raise: #FFFFFF; --hair: #DDD7C8; --hair-2: #E8E3D7;
  --ink: #22332C; --ink-2: #55615A; --muted: #8B8779; --gold: #A8834A; --gold-soft: rgba(168,131,74,.12);
  --card: #22332C; --card-ink: #F2EFE4; --card-gold: #D8C29A;
  --ok: #2F7A55; --warn: #A6622B; --bad: #A2463A;
  --viz-1: #17754E; --viz-accent: #B0792A; --viz-grid: #E4DED1; --viz-axis: #8B8779; --viz-fill: rgba(23,117,78,.10);
  --shadow: 0 1px 2px rgba(34,51,44,.05), 0 8px 24px -12px rgba(34,51,44,.18);
  --serif: "Cormorant Garamond", Georgia, "Times New Roman", serif;
  --sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Noto Sans SC", "Helvetica Neue", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #121815; --panel: #1A221E; --raise: #212A25; --hair: #2E3A34; --hair-2: #26302B;
    --ink: #E6EBE7; --ink-2: #B3BDB6; --muted: #87938C; --gold: #D2AF72; --gold-soft: rgba(210,175,114,.14);
    --card: #0D1310; --card-ink: #EDEAE0; --card-gold: #D8C29A;
    --ok: #5FB88B; --warn: #E0A26A; --bad: #E08A7D;
    --viz-1: #23815C; --viz-accent: #BF873A; --viz-grid: #2A3530; --viz-axis: #87938C; --viz-fill: rgba(35,129,92,.16);
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 28px -14px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #121815; --panel: #1A221E; --raise: #212A25; --hair: #2E3A34; --hair-2: #26302B;
  --ink: #E6EBE7; --ink-2: #B3BDB6; --muted: #87938C; --gold: #D2AF72; --gold-soft: rgba(210,175,114,.14);
  --card: #0D1310; --card-ink: #EDEAE0; --card-gold: #D8C29A;
  --ok: #5FB88B; --warn: #E0A26A; --bad: #E08A7D;
  --viz-1: #23815C; --viz-accent: #BF873A; --viz-grid: #2A3530; --viz-axis: #87938C; --viz-fill: rgba(35,129,92,.16);
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 28px -14px rgba(0,0,0,.6);
}
* { box-sizing: border-box; }
html { background: var(--bg); }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.6 var(--sans); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; border-radius: 4px; }
.serif { font-family: var(--serif); }
/* Cormorant 默认是「老式数字」（高低起伏、0 像字母 o），凡是用它显示数字的地方都改成等高等宽数字 */
.hero-n, .stat-v, .money, .no, .date b, .exp-n, .mcard-no, .hero-k { font-variant-numeric: lining-nums tabular-nums; font-feature-settings: "lnum" 1, "tnum" 1; }
.tnum { font-variant-numeric: tabular-nums; }
h1, h2, h3 { text-wrap: balance; margin: 0; }

/* ---------- 顶栏 ---------- */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-bottom: 1px solid var(--hair); }
.top-in { max-width: 1200px; margin: 0 auto; padding: 0 28px; height: 64px; display: flex; align-items: center; gap: 22px; }

.mark-s { font-size: 12px; color: var(--muted); letter-spacing: 2px; padding-left: 14px; border-left: 1px solid var(--hair); margin-left: -12px; white-space: nowrap; }
.tabs { display: flex; gap: 2px; margin-left: 4px; overflow-x: auto; scrollbar-width: none; }
.tab { border: 0; background: none; padding: 8px 13px; border-radius: 20px; color: var(--ink-2); font-size: 14px; white-space: nowrap; }
.tab:hover { background: var(--hair-2); }
.tab.on { background: var(--ink); color: var(--bg); }
.top-r { margin-left: auto; display: flex; align-items: center; gap: 12px; }
.chip-demo { font-size: 12px; color: var(--gold); background: var(--gold-soft); padding: 3px 10px; border-radius: 12px; white-space: nowrap; }
.icon-btn { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--hair); background: var(--panel); display: grid; place-items: center; font-size: 15px; }

.wrap { max-width: 1200px; margin: 0 auto; padding: 32px 28px 80px; }
.head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 24px; }
.eyebrow { font-family: var(--serif); font-style: italic; font-size: 18px; color: var(--gold); line-height: 1; }
.h1 { font-size: 28px; font-weight: 600; letter-spacing: 1px; margin-top: 6px; }
.lede { color: var(--muted); font-size: 13px; }

.hero-k { font-family: var(--serif); font-size: 20px; color: var(--card-gold); letter-spacing: .5px; }
.hero-n { font-family: var(--serif); font-size: 84px; line-height: .95; font-weight: 500; margin: 6px 0 4px; font-variant-numeric: lining-nums; }
.hero-n small { font-family: var(--sans); font-size: 15px; font-weight: 400; opacity: .7; margin-left: 8px; letter-spacing: 1px; }
.hero-s { font-size: 13px; opacity: .72; }
.hero-s b { color: var(--card-gold); font-weight: 600; }
.hero-spark { position: relative; }
.hero-spark svg { display: block; width: 100%; height: auto; overflow: visible; }

.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); background: var(--panel); border-radius: 18px; box-shadow: var(--shadow); margin-bottom: 18px; }
.stat { padding: 20px 24px; }
.stat + .stat { border-left: 1px solid var(--hair); }
.stat-k { font-size: 12px; color: var(--muted); letter-spacing: 1px; }
.stat-v { font-family: var(--serif); font-size: 42px; line-height: 1.1; font-weight: 500; margin-top: 4px; font-variant-numeric: lining-nums tabular-nums; }
.stat-d { font-size: 12px; color: var(--ink-2); }
.stat-d .up { color: var(--ok); }

.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
.panel { background: var(--panel); border-radius: 18px; box-shadow: var(--shadow); padding: 22px 24px 18px; min-width: 0; }
.p-h { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 10px; }
.p-t { font-size: 15px; font-weight: 600; }
.p-s { font-size: 12px; color: var(--muted); margin-top: 2px; }
.ghost { border: 1px solid var(--hair); background: none; color: var(--ink-2); border-radius: 14px; padding: 3px 11px; font-size: 12px; white-space: nowrap; }
.ghost:hover { border-color: var(--ink-2); }
.chart { position: relative; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart [data-tip] { cursor: default; }
.chart [data-tip]:hover .mk { opacity: .85; }
.tip { position: absolute; z-index: 5; pointer-events: none; background: var(--raise); color: var(--ink); border: 1px solid var(--hair); box-shadow: var(--shadow); border-radius: 10px; padding: 7px 11px; font-size: 12px; white-space: nowrap; transform: translate(-50%, calc(-100% - 12px)); opacity: 0; transition: opacity .12s; }
.tip b { font-weight: 600; }
.dt { margin-top: 12px; max-height: 240px; overflow: auto; border-top: 1px solid var(--hair); }

/* ---------- 表格 ---------- */
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 11px 12px; font-size: 13px; white-space: nowrap; font-variant-numeric: tabular-nums; }
th { font-weight: 500; font-size: 12px; color: var(--muted); letter-spacing: .5px; border-bottom: 1px solid var(--hair); background: var(--panel); position: sticky; top: 0; z-index: 1; }
td { border-bottom: 1px solid var(--hair-2); }
.r { text-align: right; }

/* ---------- 会员名录 ---------- */
.tools { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; margin-bottom: 16px; }
.search { position: relative; flex: 1 1 240px; max-width: 320px; }
.search input { width: 100%; border: 1px solid var(--hair); background: var(--panel); border-radius: 22px; padding: 9px 16px 9px 36px; outline: none; }
.search input:focus { border-color: var(--gold); }
.search::before { content: '⌕'; position: absolute; left: 14px; top: 50%; transform: translateY(-52%); color: var(--muted); font-size: 16px; }
.seg { display: inline-flex; background: var(--hair-2); border-radius: 22px; padding: 3px; }
.seg button { border: 0; background: none; padding: 6px 14px; border-radius: 18px; font-size: 13px; color: var(--ink-2); white-space: nowrap; }
.seg button.on { background: var(--raise); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.08); }
.sel { position: relative; }
.sel select { appearance: none; -webkit-appearance: none; border: 1px solid var(--hair); background: var(--panel); border-radius: 22px; padding: 8px 34px 8px 16px; font-size: 13px; }
.sel::after { content: ''; position: absolute; right: 15px; top: 50%; width: 6px; height: 6px; border-right: 1.5px solid var(--muted); border-bottom: 1.5px solid var(--muted); transform: translateY(-70%) rotate(45deg); pointer-events: none; }
.count { font-size: 13px; color: var(--muted); }
.btn { border: 1px solid var(--hair); background: var(--panel); border-radius: 22px; padding: 8px 18px; font-size: 13px; white-space: nowrap; }
.btn:hover { border-color: var(--ink-2); }
.btn-ink { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.btn-ink:hover { opacity: .9; }
.btn-bad { color: var(--bad); }
.push { margin-left: auto; }

.dir { background: var(--panel); border-radius: 18px; box-shadow: var(--shadow); overflow: auto; max-height: calc(100vh - 250px); }
.dir tbody tr { cursor: pointer; transition: background .1s; }
.dir tbody tr:hover { background: var(--hair-2); }
.who { display: flex; align-items: center; gap: 12px; }
.av { width: 34px; height: 34px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; line-height: 1; font-family: var(--sans); font-size: 14px; font-weight: 600; background: var(--hair-2); color: var(--ink-2); flex-shrink: 0; }
.av.m { background: var(--ink); color: var(--card-gold); }
.who > div > b { display: block; font-weight: 600; font-size: 14px; }
.who > div > span { display: block; font-size: 12px; color: var(--muted); }
.st { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-2); }
.st::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--hair); }
.st.m { color: var(--ink); } .st.m::before { background: var(--gold); }
.st.w { color: var(--warn); } .st.w::before { background: var(--warn); }
.tag-mute { font-size: 11px; color: var(--bad); border: 1px solid currentColor; border-radius: 10px; padding: 0 7px; margin-left: 6px; }
.no { font-family: var(--serif); font-size: 15px; letter-spacing: 1px; color: var(--ink-2); }
.money { font-family: var(--serif); font-size: 16px; font-weight: 500; }

/* ---------- 详情侧栏 ---------- */
.shade { position: fixed; inset: 0; z-index: 40; background: rgba(12,18,15,.42); opacity: 0; pointer-events: none; transition: opacity .2s; }
.side { position: fixed; top: 0; right: 0; bottom: 0; z-index: 41; width: min(500px, 100vw); background: var(--bg); visibility: hidden;
  padding: calc(24px + env(safe-area-inset-top, 0px)) 28px calc(28px + env(safe-area-inset-bottom, 0px)); overflow: auto; transform: translateX(100%); transition: transform .22s ease; }
.open .shade { opacity: 1; pointer-events: auto; }
.open .side { transform: none; visibility: visible; box-shadow: -20px 0 50px -30px rgba(0,0,0,.4); }
.side-h { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
.side-n { display: flex; align-items: center; gap: 14px; }

.mcard-k { font-family: var(--serif); color: var(--card-gold); font-size: 17px; }
.mcard-no { font-family: var(--serif); font-size: 30px; letter-spacing: 3px; margin: 6px 0 2px; }
.mcard-d { font-size: 12px; opacity: .7; }
.mcard.off { background: var(--panel); color: var(--ink-2); border: 1px dashed var(--hair); }
.mcard.off .mcard-k { color: var(--ink-2); }
.mcard.off::after { display: none; }
.acts { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
.sec { font-size: 12px; color: var(--muted); letter-spacing: 1px; margin: 26px 0 10px; }
.perm { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--hair-2); }
.perm b { display: block; font-size: 14px; font-weight: 500; }
.perm span { display: block; font-size: 12px; color: var(--muted); }
.sw { position: relative; width: 42px; height: 24px; border-radius: 12px; border: 0; background: var(--hair); flex-shrink: 0; transition: background .15s; }
.sw::after { content: ''; position: absolute; left: 3px; top: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.2); transition: left .15s; }
.sw.on { background: var(--viz-1); } .sw.on::after { left: 21px; }
.sw.bad.on { background: var(--bad); }
.facts { display: grid; grid-template-columns: 88px 1fr; gap: 6px 12px; font-size: 13px; }
.facts dt { color: var(--muted); } .facts dd { margin: 0; }
.trail { list-style: none; margin: 0; padding: 0 0 0 16px; border-left: 1px solid var(--hair); }
.trail li { position: relative; padding: 0 0 14px 14px; font-size: 13px; }
.trail li::before { content: ''; position: absolute; left: -20.5px; top: 7px; width: 9px; height: 9px; border-radius: 50%; background: var(--panel); border: 1.5px solid var(--muted); }
.trail li.att::before { background: var(--ink); border-color: var(--ink); }
.trail em { font-style: normal; color: var(--muted); font-size: 12px; margin-right: 8px; }
.trail small { color: var(--muted); margin-left: 6px; }
textarea { width: 100%; min-height: 64px; border: 1px solid var(--hair); background: var(--panel); border-radius: 12px; padding: 10px 12px; outline: none; resize: vertical; }
textarea:focus { border-color: var(--gold); }
.log { font-size: 12px; color: var(--ink-2); line-height: 1.9; }

/* ---------- 活动 ---------- */
.evs { display: grid; gap: 12px; }
.ev { background: var(--panel); border-radius: 18px; box-shadow: var(--shadow); padding: 18px 22px; display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; gap: 20px; align-items: center; }
.ev.past { opacity: .62; }
.date { text-align: center; border-right: 1px solid var(--hair); padding-right: 16px; }
.date b { display: block; font-family: var(--serif); font-size: 36px; line-height: 1; font-weight: 500; }
.date span { display: block; font-size: 11px; color: var(--muted); letter-spacing: 1px; margin-top: 4px; }
.ev-t { font-size: 15px; font-weight: 600; }
.ev-t .pill { font-size: 11px; font-weight: 400; color: var(--gold); background: var(--gold-soft); border-radius: 10px; padding: 1px 8px; margin-left: 8px; }
.ev-m { font-size: 12px; color: var(--muted); margin-top: 2px; }
.cap { display: flex; align-items: center; gap: 10px; margin-top: 10px; font-size: 12px; color: var(--ink-2); }
.meter { width: 180px; max-width: 40vw; height: 5px; border-radius: 3px; background: var(--viz-grid); overflow: hidden; }
.meter i { display: block; height: 100%; border-radius: 3px; background: var(--viz-1); }
.meter.full i { background: var(--viz-accent); }
.ev-side { display: flex; gap: 8px; }
.ev-more { grid-column: 1 / -1; border-top: 1px solid var(--hair); padding-top: 16px; display: grid; gap: 16px; }
.edit { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px; }
.field { display: grid; gap: 4px; font-size: 12px; color: var(--muted); }
.field input { border: 1px solid var(--hair); background: var(--raise); border-radius: 10px; padding: 7px 10px; font-size: 13px; color: var(--ink); }
.roster td { padding: 8px 12px; }
.check { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
.check input { accent-color: var(--viz-1); width: 16px; height: 16px; }

/* ---------- 导出 ---------- */
.exp { display: grid; gap: 12px; }
.exp-row { display: flex; align-items: center; gap: 20px; background: var(--panel); border-radius: 18px; box-shadow: var(--shadow); padding: 20px 24px; }
.exp-row b { display: block; font-size: 15px; }
.exp-row span { display: block; font-size: 13px; color: var(--muted); }
.exp-n { font-family: var(--serif); font-size: 32px; min-width: 70px; color: var(--gold); }

/* ---------- 扫码签到 ---------- */
.scan { display: flex; align-items: flex-end; gap: 14px; margin-bottom: 10px; }
.scan .field input { width: 100%; border: 1px solid var(--hair); background: var(--raise); border-radius: 10px; padding: 9px 12px; font-size: 15px; letter-spacing: 2px; color: var(--ink); }
.scan-msg { font-size: 13px; padding: 8px 12px; border-radius: 10px; margin-bottom: 10px; }
.scan-msg.ok { background: var(--viz-fill); color: var(--ok); }
.scan-msg.again { background: var(--gold-soft); color: var(--warn); }
.scan-msg.bad { background: rgba(162,70,58,.1); color: var(--bad); }

/* ---------- 待处理 ---------- */
.todo { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 18px; }
.todo-i { display: flex; align-items: center; gap: 14px; text-align: left; border: 1px solid var(--hair); background: var(--panel); border-radius: 16px; padding: 14px 18px; color: var(--ink); }
.todo-i:hover { border-color: var(--gold); }
.todo-i b { font-family: var(--serif); font-size: 34px; font-weight: 500; line-height: 1; font-variant-numeric: lining-nums tabular-nums; }
.todo-i span { flex: 1; font-size: 13px; font-weight: 600; }
.todo-i small { display: block; font-size: 12px; font-weight: 400; color: var(--muted); }
.todo-i i { font-style: normal; color: var(--muted); font-size: 18px; }
.sub { display: block; font-size: 12px; color: var(--muted); }
.btn.sm { padding: 5px 12px; font-size: 12px; }
.none { text-align: center; padding: 40px; color: var(--muted); }
.pill { font-size: 11px; font-weight: 400; color: var(--gold); background: var(--gold-soft); border-radius: 10px; padding: 1px 8px; margin-left: 8px; }
/* 活动表单 */
.form { display: grid; gap: 12px; }

      <div class="modal-f"><button class="btn" id="mCancel">取消</button><button class="btn ${danger ? 'btn-bad' : 'btn-ink'}" id="mOk">${esc(ok)}</button></div>`
    $('#modal').hidden = false

function panel (id, title, sub, svg, cols, rows) {
  return `<section class="panel"><div class="p-h"><div><div class="p-t">${title}</div><div class="p-s">${sub}</div></div>
    <button class="ghost" data-dt="${id}">数据表</button></div>
    <div class="chart" id="${id}">${svg}<div class="tip"></div></div>
    <div class="dt" id="dt-${id}" hidden><table><thead><tr>${cols.map((c, i) => `<th class="${i ? 'r' : ''}">${c}</th>`).join('')}</tr></thead>
    <tbody>${rows.map(r => `<tr>${r.map((v, i) => `<td class="${i ? 'r' : ''}">${v}</td>`).join('')}</tr>`).join('')}</tbody></table></div></section>`
}
function bindChart (id) {
  const box = document.getElementById(id); const tip = box.querySelector('.tip')
  box.querySelectorAll('[data-tip]').forEach(el => {
    el.addEventListener('mouseenter', () => { tip.innerHTML = el.dataset.tip; tip.style.opacity = 1 })
    el.addEventListener('mousemove', e => { const b = box.getBoundingClientRect(); tip.style.left = (e.clientX - b.left) + 'px'; tip.style.top = (e.clientY - b.top) + 'px' })
    el.addEventListener('mouseleave', () => { tip.style.opacity = 0 })
  })
  const b = document.querySelector(`[data-dt="${id}"]`); if (b) b.onclick = () => { const t = document.getElementById('dt-' + id); t.hidden = !t.hidden; b.textContent = t.hidden ? '数据表' : '收起' }
}
function cols (data, { fmt = v => v, unit = '', accentLast = false } = {}) {
  const W = 540, H = 230, L = 52, B = 30, T = 22, n = data.length, max = niceMax(Math.max(...data.map(d => d.v)))
  const step = (W - L) / n, bw = Math.min(40, step * 0.52), y = v => T + (H - T - B) * (1 - v / max)
  let g = [0, .5, 1].map(f => max * f).map(t => `<line x1="${L}" x2="${W}" y1="${y(t)}" y2="${y(t)}" stroke="var(--viz-grid)"/><text x="${L - 10}" y="${y(t) + 4}" text-anchor="end" font-size="11" fill="var(--viz-axis)">${fmt(t)}</text>`).join('')
  data.forEach((d, i) => {
    const x = L + step * i + (step - bw) / 2, h = Math.max(1, y(0) - y(d.v)), acc = accentLast && i === n - 1
    g += `<g data-tip="<b>${d.k}</b>　${fmt(d.v)}${unit}"><rect x="${L + step * i}" y="${T}" width="${step}" height="${H - T - B}" fill="transparent"/>
      <path class="mk" d="${colPath(x, y(0) - h, bw, h)}" fill="${acc ? 'var(--viz-accent)' : 'var(--viz-1)'}"/></g>
      <text x="${x + bw / 2}" y="${H - 9}" text-anchor="middle" font-size="11" fill="var(--viz-axis)">${d.k}</text>`
    if (acc) g += `<text x="${x + bw / 2}" y="${y(d.v) - 8}" text-anchor="middle" font-size="11" fill="var(--ink-2)">本月 ${fmt(d.v)}</text>`
  })
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="柱状图">${g}</svg>`
}
function rows (data, { unit = '' } = {}) {
  const W = 540, rh = 32, L = 196, R = 44, H = data.length * rh + 4, max = Math.max(1, ...data.map(d => d.v))
  let g = ''
  data.forEach((d, i) => {
    const w = (W - L - R) * d.v / max, yy = i * rh + 4
    g += `<g data-tip="<b>${esc(d.k)}</b>　${d.v}${unit}"><rect x="0" y="${yy}" width="${W}" height="${rh}" fill="transparent"/>
      <text x="${L - 12}" y="${yy + 19}" text-anchor="end" font-size="12" fill="var(--ink-2)">${esc(d.k.length > 16 ? d.k.slice(0, 15) + '…' : d.k)}</text>
      <path class="mk" d="${rowPath(L, yy + 7, Math.max(w, 1), 16)}" fill="var(--viz-1)"/>
      <text x="${L + w + 8}" y="${yy + 20}" font-size="12" fill="var(--ink)">${d.v}</text></g>`
  })
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="条形图">${g}</svg>`
}
// 主面板里的会员增长曲线：在深色卡片上，用金色描线
function spark (data) {
  const W = 460, H = 150, L = 8, R = 44, T = 18, B = 26, n = data.length, max = niceMax(Math.max(...data.map(d => d.v)))
  const x = i => L + (W - L - R) * i / (n - 1), y = v => T + (H - T - B) * (1 - v / max)
  const pts = data.map((d, i) => `${x(i)},${y(d.v)}`).join(' ')
  let g = `<line x1="${L}" x2="${W - R}" y1="${y(0)}" y2="${y(0)}" stroke="var(--card-gold)" stroke-opacity=".25"/>
    <polygon points="${x(0)},${y(0)} ${pts} ${x(n - 1)},${y(0)}" fill="var(--card-gold)" fill-opacity=".10"/>
    <polyline points="${pts}" fill="none" stroke="var(--card-gold)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`
  data.forEach((d, i) => {
    g += `<g data-tip="<b>${d.k}</b>　累计 ${d.v} 人 · 新增 ${d.add}"><rect x="${x(i) - 30}" y="0" width="60" height="${H}" fill="transparent"/>
      <circle cx="${x(i)}" cy="${y(d.v)}" r="${i === n - 1 ? 5 : 3}" fill="${i === n - 1 ? 'var(--card-gold)' : 'var(--card)'}" stroke="var(--card-gold)" stroke-width="2"/></g>
      <text x="${x(i)}" y="${H - 6}" text-anchor="middle" font-size="11" fill="var(--card-ink)" fill-opacity=".6">${d.k}</text>`
  })
  g += `<text x="${x(n - 1) + 10}" y="${y(data[n - 1].v) + 4}" font-size="13" fill="var(--card-gold)">${data[n - 1].v}</text>`
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="近 6 个月会员人数">${g}</svg>`
}

function roster (id) {
  const p = allEvents().find(x => x._id === id), r = seeded([...id].reduce((a, c) => a + c.charCodeAt(0), 7))
  const people = DB.members.slice().sort(() => r() - 0.5).slice(0, p.signed_count || 0), ck = DB.checkins[id] = DB.checkins[id] || {}
  const n = people.filter(m => ck[m.id]).length
  $('#roster').innerHTML = `
    <div class="scan"><label class="field" style="flex:1">扫码签到：用扫码枪扫用户的入场码，或者输入码下面的 6 位数字后按回车
      <input id="scanIn" placeholder="扫码或输入 6 位数字" autocomplete="off"></label><span class="count">已签到 ${n} / ${people.length}</span></div>
    <div id="scanMsg" class="scan-msg" hidden></div>
    <div style="overflow-x:auto"><table class="roster"><thead><tr><th>会员</th><th>身份</th><th>手机</th><th>入场码</th><th>到场</th></tr></thead><tbody>${people.map(m => `<tr>
    <td><div class="who"><span class="av ${isMember(m) ? 'm' : ''}">${esc(m.nickname.slice(0, 1))}</span><b>${esc(m.nickname)}</b></div></td>
    <td><span class="st ${isMember(m) ? 'm' : ''}">${isMember(m) ? '会员' : '非会员'}</span></td><td>${m.phone}</td>
    <td><span class="no">${code6(id + m.id)}</span></td>
    <td><label class="check"><input type="checkbox" data-u="${m.id}" ${ck[m.id] ? 'checked' : ''}>已到场</label></td></tr>`).join('')}</tbody></table></div>`
  $('#roster').querySelectorAll('[data-u]').forEach(cb => cb.onchange = () => { ck[cb.dataset.u] = cb.checked; save(); roster(id) })
  const inp = $('#scanIn'); inp.focus()
  inp.onkeydown = e => {
    if (e.key !== 'Enter') return
    // 扫码枪扫出来的是「MYC:订单号:6 位数字」，手输的是 6 位数字，两种都认
    const raw = inp.value.trim(), digits = (raw.match(/(\d{6})$/) || [])[1]
    const m = people.find(x => code6(id + x.id) === digits)
    const msg = $('#scanMsg'); msg.hidden = false
    if (!m) { msg.className = 'scan-msg bad'; msg.textContent = `没找到「${raw}」，请核对 6 位数字`; inp.select(); return }
    if (ck[m.id]) { msg.className = 'scan-msg again'; msg.textContent = `${m.nickname} 已经签到过了`; inp.select(); return }
    ck[m.id] = true; save(); roster(id)
    const m2 = $('#scanMsg'); m2.hidden = false; m2.className = 'scan-msg ok'; m2.textContent = `签到成功：${m.nickname}${isMember(m) ? '（会员 ' + m.member_no + '）' : ''}`
  }
}
// 与小程序同一套算法：订单号 → 固定的 6 位数字
function code6 (str) { let h = 2166136261; for (const c of String(str)) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619) >>> 0 } return String(h % 1000000).padStart(6, '0') }

function qrSvg (text, size = 132) {
  if (typeof qrcode !== 'function') return '<div class="qr-miss">二维码组件没加载出来（需要联网）</div>'
  const q = qrcode(0, 'M'); q.addData(text); q.make()
  const n = q.getModuleCount(), cell = size / (n + 4); let d = ''
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (q.isDark(r, c)) d += `M${((c + 2) * cell).toFixed(2)},${((r + 2) * cell).toFixed(2)}h${cell.toFixed(2)}v${cell.toFixed(2)}h-${cell.toFixed(2)}z`
  return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" role="img" aria-label="渠道二维码"><rect width="${size}" height="${size}" fill="#FFFFFF"/><path d="${d}" fill="#22332C"/></svg>`
}
function qrPng (text, name) {
  const q = qrcode(0, 'M'); q.addData(text); q.make()
  const n = q.getModuleCount(), cell = 12, size = (n + 8) * cell, cv = document.createElement('canvas'); cv.width = size; cv.height = size + 60
  const x = cv.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, cv.width, cv.height); x.fillStyle = '#22332C'
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (q.isDark(r, c)) x.fillRect((c + 4) * cell, (r + 4) * cell, cell, cell)
  x.font = '600 26px sans-serif'; x.textAlign = 'center'; x.fillText(name, size / 2, size + 30)
  const a = document.createElement('a'); a.href = cv.toDataURL('image/png'); a.download = `渠道码_${name}.png`; document.body.appendChild(a); a.click(); a.remove()
}
V.channels = () => {
  const list = channelList().map(c => {
    const us = DB.members.filter(m => m.source === c.name)
    return Object.assign(c, { users: us.length, members: us.filter(isMember).length, revenue: us.reduce((a, m) => a + spent(m), 0), path: `pages/index/index?channel=${c.id}` })
  }).sort((a, b) => b.users - a.users)
  $('#main').innerHTML = `
    <div class="head"><div><div class="eyebrow">Channels</div><h1 class="h1">渠道码</h1></div><button class="btn btn-ink" id="newCh">新建渠道码</button></div>
    <div class="lede" style="margin:-12px 0 16px">给每个 Podcast、合作品牌、线下物料各发一个码。用户扫哪个码进来，就自动记上哪个来源，下面的人数和收入跟着统计。演示版生成的是普通二维码（内容为小程序页面路径）；正式版由后台生成微信小程序码，用微信一扫就进小程序</div>
    <div class="chs">${list.map(c => `<article class="ch" data-id="${c.id}">
      <div class="ch-qr">${qrSvg(c.path)}</div>
      <div class="ch-b"><div class="ch-k">${(CH_TYPES.find(t => t[0] === c.type) || ['', '其他'])[1]}</div><div class="ch-t">${esc(c.name)}</div>
        <div class="ch-n"><span><b class="tnum">${c.users}</b>位用户</span><span><b class="tnum">${c.members}</b>位入会</span><span><b class="tnum">¥${yuan(c.revenue)}</b>累计消费</span></div>
        <code class="ch-p">${esc(c.path)}</code>
        <div class="acts"><button class="btn sm" data-png>下载图片</button><button class="btn sm" data-copy>复制页面路径</button></div></div>
    </article>`).join('')}</div>`
  document.querySelectorAll('.ch').forEach(el => {
    const c = list.find(x => x.id === el.dataset.id)
    el.querySelector('[data-png]').onclick = () => { try { qrPng(c.path, c.name) } catch (e) { toast('下载没成功，可以直接截图这张码') } }
    el.querySelector('[data-copy]').onclick = () => { try { navigator.clipboard.writeText(c.path).then(() => toast('已复制页面路径'), () => toast('没能复制，请手动选中')) } catch (e) { toast('没能复制，请手动选中') } }
  })
  $('#newCh').onclick = async () => {
    const v = await dialog({ title: '新建渠道码', text: '起一个一看就知道是哪儿的名字，例如「Podcast 第 43 期」「前滩书店台卡」。', fields: [{ id: 'n', label: '渠道名称', ph: '例如：前滩书店台卡' }, { id: 't', label: '渠道类型', options: CH_TYPES, value: 'offline' }], ok: '生成' })
    if (!v || !v.n) return
    DB.channels.push({ id: 'ch_' + Date.now().toString(36), name: v.n, type: v.t, created: d2s(TODAY) }); save(); V.channels(); toast('已生成「' + v.n + '」的渠道码')
  }
}

V.export = () => {
  const ms = DB.members, nOrders = ms.reduce((a, m) => a + m.orders.length, 0), nAtt = ms.reduce((a, m) => a + joins(m), 0)
  $('#main').innerHTML = `
    <div class="head"><div><div class="eyebrow">Export</div><h1 class="h1">导出</h1></div><div class="lede">「复制表格」后在 Excel 里直接粘贴，会自动分好列；「下载 CSV」可以用 Excel 打开，中文不乱码</div></div>
    <div class="exp">
      <div class="exp-row"><div class="exp-n tnum">${ms.length}</div><div style="flex:1"><b>会员表</b><span>身份、编号、到期日、来源、城市、累计消费、报名与到场次数、各项权限</span></div><div class="acts" style="margin:0"><button class="btn" data-c="members">复制表格</button><button class="btn btn-ink" data-x="members">下载 CSV</button></div></div>
      <div class="exp-row"><div class="exp-n tnum">${nOrders}</div><div style="flex:1"><b>订单表</b><span>每一笔会员年费、活动报名和商品购买，带金额和日期</span></div><div class="acts" style="margin:0"><button class="btn" data-c="orders">复制表格</button><button class="btn btn-ink" data-x="orders">下载 CSV</button></div></div>
      <div class="exp-row"><div class="exp-n tnum">${DB.leads.length}</div><div style="flex:1"><b>线索表</b><span>心灵齐旅意向和机构合作咨询，带跟进状态、备注和成交金额</span></div><div class="acts" style="margin:0"><button class="btn" data-c="leads">复制表格</button><button class="btn btn-ink" data-x="leads">下载 CSV</button></div></div>
      <div class="exp-row"><div class="exp-n tnum">${nAtt}</div><div style="flex:1"><b>报名到场表</b><span>每位用户参加过的活动，以及是否实际到场</span></div><div class="acts" style="margin:0"><button class="btn" data-c="attend">复制表格</button><button class="btn btn-ink" data-x="attend">下载 CSV</button></div></div>
    </div>`
  document.querySelectorAll('[data-x]').forEach(b => b.onclick = () => exportCsv(b.dataset.x))
  document.querySelectorAll('[data-c]').forEach(b => b.onclick = () => copyTable(b.dataset.c))
}
// 复制成「制表符分隔」的文字：粘贴进 Excel / WPS / 飞书表格会自动分列
function copyTable (kind) {
  const out = tableRows(kind)
  const tsv = out.map(r => r.map(v => String(v == null ? '' : v).replace(/[\t\n\r]+/g, ' ')).join('\t')).join('\n')
  const done = () => toast(`已复制 ${out.length - 1} 行，去 Excel 里粘贴`)
  const fallback = () => {
    const ta = document.createElement('textarea'); ta.value = tsv; ta.style.position = 'fixed'; ta.style.opacity = '0'
    document.body.appendChild(ta); ta.select()
    try { document.execCommand('copy') ? done() : toast('没能复制，请改用「下载 CSV」') } catch (e) { toast('没能复制，请改用「下载 CSV」') }
    ta.remove()
  }
  try { navigator.clipboard.writeText(tsv).then(done, fallback) } catch (e) { fallback() }
}
function exportCsv (kind) {
  const out = tableRows(kind)
  const csv = '\ufeff' + out.map(r => r.map(v => `"${String(v == null ? '' : v).replace(/"/g, '""')}"`).join(',')).join('\r\n')
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }))
  a.download = `MindYoga_${{ members: '会员表', orders: '订单表', attend: '报名到场表', leads: '线索表' }[kind]}_${d2s(TODAY)}.csv`
  document.body.appendChild(a); a.click(); a.remove(); toast(`已下载 ${out.length - 1} 行`)
}
function tableRows (kind) {
  const ms = DB.members, out = []
  if (kind === 'leads') {
    out.push(['提交时间', '类型', '称呼', '手机', '对象', '说明', '状态', '备注', '成交金额（元）'])
    DB.leads.forEach(l => out.push([l.at, l.kind === 'journey' ? '心灵齐旅意向' : '机构合作', l.name, l.phone, l.target, l.detail, LEAD_ST[l.status], l.note, l.amount / 100]))
    return out
  }
  if (kind === 'members') {
    out.push(['昵称', '手机', '身份', '会员编号', '入会日', '到期日', '来源', '城市', '首次进入', '累计消费（元）', '报名次数', '到场次数', '社群发言', 'Club 限定', '优先报名', '禁言', '备注'])
    ms.forEach(m => out.push([m.nickname, m.phone, isMember(m) ? '会员' : '非会员', m.member_no, m.member_since, isMember(m) ? m.member_expire_at : '', m.source, m.city, m.first_visit_at, spent(m) / 100, joins(m), shows(m),
      ...['post', 'club', 'priority'].map(k => m.perms[k] ? '是' : '否'), m.muted ? '是' : '否', m.note]))
  } else {
    out.push(kind === 'orders' ? ['日期', '昵称', '手机', '内容', '类型', '金额（元）'] : ['日期', '昵称', '手机', '活动', '类型', '是否到场'])
    ms.forEach(m => m.orders.filter(o => kind === 'orders' || (o.t !== 'club' && o.t !== 'goods')).forEach(o =>
      out.push(kind === 'orders' ? [o.at, m.nickname, m.phone, o.title, TYPE[o.t], o.amount / 100] : [o.at, m.nickname, m.phone, o.title, TYPE[o.t], o.attended ? '是' : '否'])))
  }
  return out
}

let CUR = 'overview'
function show (v) { CUR = v; try { history.replaceState(null, '', '#' + v) } catch (e) {} document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.v === v)); closeSide(); V[v](); window.scrollTo(0, 0) }
document.querySelectorAll('.tab').forEach(b => b.onclick = () => show(b.dataset.v))
$('#theme').onclick = () => {
  const r = document.documentElement, dark = r.dataset.theme ? r.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches
  r.dataset.theme = dark ? 'light' : 'dark'; try { localStorage.setItem('mindyoga_admin_theme', r.dataset.theme) } catch (e) {}
}
try { const t = localStorage.getItem('mindyoga_admin_theme'); if (t) document.documentElement.dataset.theme = t } catch (e) {}
show(V[location.hash.slice(1)] ? location.hash.slice(1) : 'overview')
</script>
